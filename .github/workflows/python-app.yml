name: Python Application CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # 1. سحب الكود من المستودع
    - uses: actions/checkout@v3

    # 2. إعداد نسخة بايثون في السيرفر الافتراضي
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. تنزيل المكتبات بناءً على ملف المتطلبات الخاص بك
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

    # 4. فحص الكود (Linting) للتأكد من عدم وجود أخطاء برمجية فادحة
    - name: Run code check
      run: |
        pip install flake8
        # فحص ملفات البايثون في مجلد backend
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
